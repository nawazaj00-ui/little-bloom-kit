<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Bloom Kit</title>
<style>body{font-family:system-ui,sans-serif;background:#ffd6e8;color:#5b2a86;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}h1{font-size:2rem;text-align:center}</style>
</head><body><h1>🌸 Little Bloom Kit is loading…</h1>
<script>
(async()=>{
  const n=13;
  let html='';
  for(let i=1;i<=n;i++){
    const r=await fetch('parts/part-'+String(i).padStart(2,'0')+'.txt');
    if(!r.ok) throw new Error('Missing part '+i);
    html+=await r.text();
  }
  document.open(); document.write(html); document.close();
})().catch(e=>{document.body.innerHTML='<h1>Could not load Little Bloom Kit. Please refresh.</h1><p>'+e.message+'</p>'});
</script></body></html>
